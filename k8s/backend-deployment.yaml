apiVersion: apps/v1
kind: Deployment
metadata:
  name: road-ai-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: road-ai-backend
  template:
    metadata:
      labels:
        app: road-ai-backend
    spec:
      containers:
        - name: backend
          image: yourdockerhub/road-ai-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:admin123@road-ai-db:5432/road_ai"
            - name: JWT_SECRET_KEY
              value: "super_secret"
            - name: AUTHORITY_EMAIL
              value: "pwd@yourgov.org"
            - name: SMTP_USER
              value: "your_email@gmail.com"
            - name: SMTP_PASSWORD
              value: "your_password"
            - name: SMTP_HOST
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "587"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: road-ai-backend
spec:
  selector:
    app: road-ai-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
