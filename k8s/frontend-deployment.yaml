apiVersion: apps/v1
kind: Deployment
metadata:
  name: road-ai-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: road-ai-frontend
  template:
    metadata:
      labels:
        app: road-ai-frontend
    spec:
      containers:
        - name: frontend
          image: yourdockerhub/road-ai-frontend:latest
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: road-ai-frontend
spec:
  selector:
    app: road-ai-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5173
  type: LoadBalancer
