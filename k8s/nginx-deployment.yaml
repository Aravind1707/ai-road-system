apiVersion: apps/v1
kind: Deployment
metadata:
  name: road-ai-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: road-ai-nginx
  template:
    metadata:
      labels:
        app: road-ai-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config-volume
          configMap:
            name: road-ai-nginx-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: road-ai-nginx-config
data:
  nginx.conf: |-
    events {}
    http {
      server {
        listen 80;
        server_name _;

        location /api/ {
          proxy_pass http://road-ai-backend:8000/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
          proxy_pass http://road-ai-frontend:5173/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: road-ai-nginx
spec:
  type: LoadBalancer
  selector:
    app: road-ai-nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
    - protocol: TCP
      port: 443
      targetPort: 443
